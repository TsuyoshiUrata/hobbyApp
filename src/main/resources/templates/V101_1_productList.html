    <div class="header">

        <h1>商品選択</h1>

        <form th:action="@{/searchProductList}" th:object="${productForm}" method="get"
            style="display:flex; justify-content:center; align-items:center; gap:8px;">

            <input type="text" th:field="*{productName}" style="width: 250px;">
            <button class="search-button" type="submit">商品検索</button>
        </form>

        <br>

        <div class="tab-switch">
            <label><input type="radio" name="TAB" checked>家電</label>
            <div class="tab-content">
                <table border="2" align="center">
                    <tr>
                        <th>商品名</th>
                        <th>値段</th>
                        <th>特徴</th>
                    </tr>
                    <div class="product-table-area">
                        <tr th:each="product : ${listProductDto}" th:if="${product.categoryId == 1}">
                            <td class="product-name-cell">
                                <span class="stock-badge" th:text="'残り' + ${product.stock} + '点'"
                                    th:if="${product.stock}<10">
                                </span>
                                <a th:href="@{/productDetail/{productId}(productId=${product.productId})}">
                                    <span th:text="${product.productName}"></span>
                                </a>
                            </td>
                            <td th:text="${product.price}"></td>
                            <td th:text="${product.description}"></td>
                        </tr>
                    </div>
                </table>
            </div>
