<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>パスワード変更</title>
</head>

<body>
    <div class="header">
        <h3> ヘッダー </h3>
        <div th:insert="~{header}"> </div>
    </div>

    <hr>
    <br>

    <div class="body">


        <h1>ID確認/パスワード修正</h1>
        <div sec:authorize="isAnonymous" th:if="${memberDto == null}">
            <p class="error" th:text="${message}"> エラーメッセージ </p>

            <form method="get" th:action="@{/searchMemberByBirth}" th:object="${revisePasswordForm}" class="input-form">

                <table class="input-table">

                    <tr>
                        <th>本人確認方法</th>
                        <td class="radio-group">

                            <label>
                                <input type="radio" name="searchType" value="mail" id="radioMail">
                                メールアドレス
                            </label>

                            <label>
                                <input type="radio" name="searchType" value="phone" id="radioPhone">
                                電話番号
                            </label>

                        </td>
                    </tr>

                    <!-- メールアドレス -->
                    <tr id="mailRow" style="display:none;">
                        <th>メールアドレス</th>
                        <td>
                            <input type="text" th:field="*{memberMail}" id="memberMail" placeholder="test@test">

                            <div th:errors="*{memberMail}" class="input-error"></div>
                        </td>
                    </tr>

                    <!-- 電話番号 -->
                    <tr id="phoneRow" style="display:none;">
                        <th>電話番号</th>
                        <td>
                            <input type="text" th:field="*{memberPhone}" id="memberPhone" placeholder="000-0000-0000">

                            <div th:errors="*{memberPhone}" class="input-error"></div>
                        </td>
                    </tr>

                    <tr>
                        <th>生年月日</th>
                        <td>
                            <input type="date" th:field="*{memberBirth}" id="memberBirth" max="9999-12-31">

                            <div th:errors="*{memberBirth}" class="input-error"></div>
                        </td>
                    </tr>

                </table>

                <button id="confirmButton" class="common-button" disabled>
                    確認画面へ
                </button>

            </form>
        </div>

        <div sec:authorize="isAnonymous">
            <table class="confirm-table" border="1" th:if="${memberDto != null}">
                <tr>
                    <th> あなたのメンバーコード </th>
                    <td><span th:text="${memberDto.memberCode}"></span></td>
                </tr>
            </table>
        </div>

        <div th:if="${#authorization.expression('isAuthenticated()') or memberDto != null}">
            <p class="error" th:text="${message}"> エラーメッセージ </p>
            <form method="post" th:action="@{/revisePasswordComplete}" th:object="${passwordForm}" class="input-form">
                <input type="hidden" th:field="*{memberCode}">
                <table class="input-table">
                    <tr>
                        <th>新規パスワード</th>
                        <td>
                            <input type="password" th:field="*{memberPass1}">

                            <div th:errors="*{memberPass1}" class="input-error"></div>
                        </td>
                    </tr>
                    <tr>
                        <th>パスワード確認用</th>
                        <td>
                            <input type="password" th:field="*{memberPass2}">

                            <div th:errors="*{memberPass2}" class="input-error"></div>
                        </td>
                    </tr>
                </table>
                <button id="confirmButton" class="common-button">
                    パスワード変更
                </button>
            </form>
        </div>






        <form th:action="@{/top}" method="get">
            <button class="common-button">トップに戻る</button>
        </form>






        <script>

            const birth = document.getElementById("memberBirth");

            const mail = document.getElementById("memberMail");
            const phone = document.getElementById("memberPhone");

            const mailRow = document.getElementById("mailRow");
            const phoneRow = document.getElementById("phoneRow");

            const radioMail = document.getElementById("radioMail");
            const radioPhone = document.getElementById("radioPhone");

            const button = document.getElementById("confirmButton");

            function checkInput() {

                const birthOk = birth.value.trim() !== "";

                let otherOk = false;

                if (radioMail.checked) {
                    otherOk = mail.value.trim() !== "";
                }

                if (radioPhone.checked) {
                    otherOk = phone.value.trim() !== "";
                }

                button.disabled = !(birthOk && otherOk);
            }

            radioMail.addEventListener("change", function () {

                mailRow.style.display = "";
                phoneRow.style.display = "none";

                phone.value = "";

                checkInput();

            });

            radioPhone.addEventListener("change", function () {

                phoneRow.style.display = "";
                mailRow.style.display = "none";

                mail.value = "";

                checkInput();

            });

            birth.addEventListener("input", checkInput);
            mail.addEventListener("input", checkInput);
            phone.addEventListener("input", checkInput);

        </script>
</body>

</html>
