<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>メンバー詳細</title>
</head>

<body>
    <div class="header">
        <h3> ヘッダー </h3>
        <div th:insert="~{header}"> </div>
    </div>

    <hr>
    <br>

    <div class="body">


        <h1>メンバー詳細</h1>


        <table class="memberDetail-table">
            <tr>
                <th>メンバーコード</th>
                <th>名前</th>
                <th>登録日</th>
                <th>メールアドレス</th>
                <th>電話番号</th>
                <th>住所</th>
                <th>誕生日</th>
                <th>ランク</th>
                <th>権限</th>
            </tr>
            <tr>
                <td th:text="*{memberDto.memberCode}"></td>
                <td th:text="*{memberDto.memberName}"></td>
                <td th:text="*{memberDto.memberJoin}"></td>
                <td th:text="*{memberDto.memberMail}"></td>
                <td th:text="*{memberDto.memberPhone}"></td>
                <td th:text="*{memberDto.memberAddress}"></td>
                <td th:text="*{memberDto.memberBirth}"></td>
                <td th:text="*{memberDto.memberRank}"></td>
                <!-- 権限の出力 -->
                <td th:switch="*{memberDto.memberRole}">
                    <span th:case="'employee'">従業員</span>
                    <span th:case="'customer'">顧客</span>
                    <span th:case="*">不明</span>
                </td>
            </tr>
        </table>




        <form th:action="@{/memberList}" method="get">
            <button class="common-button">メンバー一覧に戻る</button>
        </form>

    </div>
</body>

</html>
