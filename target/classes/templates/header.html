<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Top</title>
</head>

<body>
    <div class="body">

        <div class="container">
            <form th:action="@{/top}" method="get">
                <button class="header-button">
                    トップに戻る
                </button>
            </form>



            <div sec:authorize="isAnonymous()">
                未ログイン
            </div>

            <div sec:authorize="isAuthenticated()">
                <button id="showDialog" class="header-button">メンバー情報</button>
                <dialog>
                    <div style="text-align: center;">
                        <h3>メンバー情報</h3>

                        <p>メンバーコード：<span th:text="${#authentication.name}"></span></p>
                        <p>名前：<span th:text="${#authentication.principal.memberDto.memberName}"></span></p>

                        <div th:switch="${#authentication.principal.memberDto.memberRole}">
                            <p th:case="'employee'">ステータス：従業員</p>
                            <p th:case="'customer'">ステータス：顧客</p>
                            <p th:case="*">ステータス：不明</p>
                        </div>
                        <p>ランク：<span sec:authentication="principal.memberDto.memberRank"></span></p>


                        <p align="center">
                            <button id="closeDialog" class="search-button">とじる</button>
                        </p>
                    </div>
                </dialog>
            </div>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" style="margin-left:auto;">
                <button class="header-button">
                    ログアウト
                </button>
            </form>


        </div>


    </div>
    <hr>

    <script>
        const dialog = document.querySelector("dialog");

        const showButton = document.querySelector("#showDialog");
        showButton.addEventListener("click", () => {
            dialog.showModal(); // モーダルダイアログを開く
        });

        const closeButton = document.querySelector("#closeDialog");
        closeButton.addEventListener("click", () => {
            dialog.close(); // モーダルダイアログを閉じる
        });

    </script>
</body>

</html>
