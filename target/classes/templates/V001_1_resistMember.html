<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>メンバー登録</title>
</head>

<body>
    <div class="header">
        <h3> ヘッダー </h3>
        <div th:insert="~{header}"> </div>
    </div>

    <hr>
    <br>

    <div class="body">
        <h1>メンバー登録</h1>
        <p class="error" th:text="${message}"> エラーメッセージ </p>

        <form method="post" th:action="@{/resistMemberConfirm}" th:object="${resistMemberForm}" class="input-form">
            <table class="input-table">
                <tr>
                    <th> 氏名 </th>
                    <td> <input type="text" maxlength="20" th:field="*{memberName}" placeholder="浦田　剛志">
                        <div th:errors="*{memberName}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> メールアドレス </th>
                    <td> <input type="email" th:field="*{memberMail}" placeholder="urata@tsuyoshi.com">
                        <div th:errors="*{memberMail}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> 電話番号 </th>
                    <td> <input type="text" maxlength="20" th:field="*{memberPhone}" pattern="\d{2,4}-\d{2,4}-\d{2,4}"
                            placeholder="000-0000-0000">
                        <div th:errors="*{memberPhone}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> 郵便番号 </th>
                    <td> <input type="text" maxlength="8" th:field="*{memberPost}" pattern="\d{3}-\d{4}"
                            placeholder="000-0000" id="memberPost">
                        <div th:errors="*{memberPost}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> 住所 </th>
                    <td> <input type="text" maxlength="50" th:field="*{memberAddress}" placeholder="東京都江東区枝川"
                            id="memberAddress">
                        <div th:errors="*{memberAddress}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> 権限 </th>
                    <td> <select th:field="*{memberRole}">
                            <option value=""> 選択してください
                            <option value="employee"> 従業員
                            <option value="customer"> 顧客
                        </select>
                        <div th:errors="*{memberRole}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> 誕生日 </th>
                    <td> <input type="date" th:field="*{memberBirth}" max="9999-12-31">
                        <div th:errors="*{memberBirth}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> パスワード </th>
                    <td> <input type="password" th:field="*{memberPass1}">
                        <div th:errors="*{memberPass1}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
                <tr>
                    <th> パスワード確認用 </th>
                    <td> <input type="password" th:field="*{memberPass2}">
                        <div th:errors="*{memberPass2}" class="input-error"> エラーメッセージ </div>
                    </td>
                </tr>
            </table>
            <button class="common-button">
                確認画面へ
            </button>
        </form>

    </div>

    <!--郵便番号から住所を自動入力するjavaScript-->
    <script>
        const post = document.getElementById("memberPost");

        post.addEventListener("input", function () {

            const zipcode = this.value.replace("-", "");

            if (zipcode.length !== 7) {
                return;
            }

            fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode=" + zipcode)
                .then(response => response.json())
                .then(data => {

                    if (data.results) {
                        const result = data.results[0];

                        document.getElementById("memberAddress").value =
                            result.address1 +
                            result.address2 +
                            result.address3;
                    } else {
                        alert("住所が見つかりませんでした。");
                    }
                })
                .catch(error => {
                    console.error(error);
                });

        });
    </script>


</body>

</html>
