<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>メンバー一覧</title>
</head>

<body>
    <div class="header">
        <h3> ヘッダー </h3>
        <div th:insert="~{header}"> </div>
    </div>

    <hr>
    <br>

    <div class="body">


        <h1>メンバー一覧</h1>

        <h2>従業員 (<span th:text="${#lists.size(employeeList)}"></span>名)</h2>
        <table class="confirm-table">
            <tr>
                <th>メンバーコード</th>
                <th>名前</th>
                <th>登録日</th>
            </tr>
            <tr th:each="item : ${employeeList}">
                <td>
                    <a th:href="@{/memberListDetail/{memberCode}(memberCode=${item.memberCode})}">
                        <p th:text="*{item.memberCode}"></p>
                    </a>
                </td>
                <td th:text="*{item.memberName}"></td>
                <td th:text="*{item.memberJoin}"></td>
            </tr>
        </table>

        <br>

        <h2>顧客 (<span th:text="${#lists.size(customerList)}"></span>名)</h2>
        <table class="confirm-table">
            <tr>
                <th>メンバーコード</th>
                <th>名前</th>
                <th>登録日</th>
            </tr>
            <tr th:each="item : ${customerList}">
                <td>
                    <a th:href="@{/memberListDetail/{memberCode}(memberCode=${item.memberCode})}">
                        <p th:text="*{item.memberCode}"></p>
                    </a>
                </td>
                <td th:text="*{item.memberName}"></td>
                <td th:text="*{item.memberJoin}"></td>
            </tr>
        </table>





        <form th:action="@{/top}" method="get">
            <button class="common-button">トップに戻る</button>
        </form>

    </div>
</body>

</html>
