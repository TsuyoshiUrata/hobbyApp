<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>メンバー詳細</title>
</head>

<body>
    <div class="header">
        <h3> ヘッダー </h3>
        <div th:insert="~{header}"> </div>
    </div>

    <hr>
    <br>

    <div class="body">


        <h1>商品詳細</h1>

<div class="product-table-area">
        <table  border="2" align="center">

    <div class="stock-badge" th:text="'残り' + ${productDto.stock} + '点'"> </div>
            
            <tr>
                <th>商品名</th>
                <td th:text="${productDto.productName}"></td>
            </tr>
            <tr>
                <th>製造会社</th>
                <td th:text="${productDto.manufacturer}"></td>
            </tr>
            <tr>
                <th>値段</th>
                <td th:text="${productDto.price}"></td>
            </tr>
            <tr>
                <th>在庫</th>
                <td th:text="${productDto.stock}"></td>
            </tr>
            <tr>
                <th>注文締切日</th>
                <td th:text="${productDto.orderDeadline}"></td>
            </tr>
            <tr>
                <th>詳細</th>
                <td th:text="${productDto.description}"></td>
            </tr>

        </table>
        </div>




        <form th:action="@{/productList}" method="get">
            <button class="common-button">商品詳細に戻る

                
            </button>
        </form>

    </div>
</body>

</html>
