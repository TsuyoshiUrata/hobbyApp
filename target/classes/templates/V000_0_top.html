<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Top</title>
</head>

<body>
    <div class="header">
        <h3> ヘッダー </h3>
        <div th:insert="~{header}"> </div>
    </div>

    <hr>
    <br>

    <div class="body">
        <h1>メニュー</h1>
        <form th:action="@{/resistMember}" method="get">
            <button class="common-button">
                メンバー登録
            </button>
        </form>
        <form th:action="@{/memberList}" method="get">
            <button class="common-button">
                メンバー一覧
            </button>
        </form>
        <form th:action="@{login}" method="get">
            <button class="common-button">
                ログイン
            </button>
        </form>
        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button class="common-button">ログアウト</button>
            </form>
        </div>

        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/reviseMember}" method="get">
                <button class="common-button">メンバー情報修正</button>
            </form>
        </div>

    </div>
</body>

</html>
